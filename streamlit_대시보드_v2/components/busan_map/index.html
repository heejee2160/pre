<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
:root{--navy:#1C2E57;--blue:#1450D2;--blue2:#4C8FEA;--ink:#1A1D23;--mut:#6B7280;--line:#E3E8EF;--bg:#F4F6F9;--sky:#256ef4}
*{box-sizing:border-box}
html,body{margin:0;font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;background:transparent}
#root{position:relative;width:100%;border-radius:10px;overflow:hidden;background:#e9eef3}
#map{display:block;width:100%;cursor:grab}
#map.drag{cursor:grabbing}
#map path{stroke:#fff;stroke-width:.7;vector-effect:non-scaling-stroke;cursor:pointer}
#map path.on{stroke:#1A1D23;stroke-width:2.4}
#map path.hit{stroke:#256ef4;stroke-width:3}
/* 상단 검색·토글 */
.top{position:absolute;left:16px;top:14px;display:flex;gap:10px;align-items:center}
.search{position:relative}
.search input{width:300px;height:36px;border:1px solid #d5dbe3;border-radius:18px;padding:0 38px 0 16px;font-size:13px;background:#fff;outline:none}
.search input:focus{border-color:var(--sky)}
.search svg{position:absolute;right:13px;top:10px}
.seg{display:flex;background:#fff;border-radius:18px;padding:3px;border:1px solid #d5dbe3}
.seg button{border:0;background:none;padding:6px 16px;border-radius:15px;font-size:13px;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff;font-weight:700}
.seg button:disabled{cursor:not-allowed;opacity:.6}
.cmpbtn{height:36px;border:0;border-radius:18px;background:var(--sky);color:#fff;font-weight:700;font-size:13px;padding:0 16px;cursor:pointer}
/* 오른쪽 컨트롤 */
.ctl{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px}
.ctl button{width:34px;height:34px;border:1px solid #d5dbe3;background:#fff;border-radius:8px;font-size:16px;color:var(--ink);cursor:pointer;line-height:1}
.ctl .gap{height:8px}
/* 범례 (세로) */
.legend{position:absolute;left:16px;bottom:16px;background:#fff;border-radius:8px;padding:10px 12px;font-size:12px;color:var(--mut);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.legend b{color:var(--ink);display:block;margin-bottom:6px}
.legend div{display:flex;align-items:center;gap:6px;margin:3px 0}
.legend i{width:14px;height:10px;border-radius:2px;border:1px solid #c4c9ce}
.src{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:11px;color:var(--mut);background:rgba(255,255,255,.85);padding:3px 8px;border-radius:4px;white-space:nowrap}
/* 호버 정보 카드 (오른쪽 아래) */
.info{position:absolute;right:16px;bottom:30px;width:300px;background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 2px 12px rgba(0,0,0,.12);font-size:13px;color:var(--ink);display:none}
.info .h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.info .dg{font-size:20px;font-weight:700}
.info .gu{font-size:12px;color:var(--mut)}
.info .st{margin-left:auto;font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px}
.info .rw{display:flex;justify-content:space-between;padding:4px 0}
.info .rw span:first-child{color:var(--mut)}
.info .go{display:block;margin-top:8px;color:var(--sky);font-weight:700;cursor:pointer}
.pin{position:absolute;width:22px;height:22px;margin:-22px 0 0 -11px;pointer-events:none;display:none}
.tag{font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:3px}
.real{background:#eaf6ec;color:#267337}.mock{background:#fff3db;color:#8a5c00}
/* 비교 패널 */
.cmp{position:absolute;left:16px;top:62px;width:440px;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.15);padding:18px 18px 12px;display:none;font-size:13px}
.cmp h3{margin:0 0 2px;font-size:17px;color:var(--ink)}
.cmp .sub{font-size:11.5px;color:var(--mut)}
.cmp .x{position:absolute;right:14px;top:14px;cursor:pointer;font-size:18px;color:#9CA3AF}
.cmp select{position:absolute;right:42px;top:14px;height:30px;border:1px solid #d5dbe3;border-radius:6px;font-size:12px;padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:14px;font-size:12px;font-weight:700;color:#fff}
.chip b{cursor:pointer;font-weight:400;opacity:.8}
.cmp table{width:100%;border-collapse:collapse}
.cmp th{font-size:11.5px;color:var(--mut);font-weight:400;text-align:right;padding:5px 4px;border-bottom:1px solid var(--line)}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp td{padding:7px 4px;text-align:right;border-bottom:1px solid #f0f2f5}
.cmp tr.hl td{background:#fdeeee}
.cmp .d{color:#d6342c;font-weight:700}
.cmp .foot{font-size:11px;color:var(--mut);margin-top:8px}
/* TOP 팝업 */
.dim{position:absolute;inset:0;background:rgba(20,30,50,.10)}
.pop{position:absolute;left:50%;top:60px;transform:translateX(-50%);width:min(620px,92%);background:#fff;border-radius:16px;padding:20px 22px 10px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.pop h2{margin:0;font-size:19px;color:var(--ink)}
.pop .sub{margin:4px 0 12px;font-size:11.5px;color:var(--mut)}
.pop .x{position:absolute;right:16px;top:14px;width:26px;height:26px;cursor:pointer}
.pop .x:before,.pop .x:after{content:"";position:absolute;left:12px;top:3px;width:2px;height:20px;background:#9CA3AF;border-radius:2px}
.pop .x:before{transform:rotate(45deg)}.pop .x:after{transform:rotate(-45deg)}
.list .r{height:48px;transition:height .4s cubic-bezier(.3,.7,.2,1);position:relative;cursor:pointer}
.list .c{position:absolute;inset:0 0 8px 0;border-radius:12px;background:var(--bg);overflow:hidden;transition:background .4s}
.list .c>*{position:absolute;transition:all .4s cubic-bezier(.3,.7,.2,1);white-space:nowrap;line-height:1}
.rk{left:12px;top:11px;width:46px;height:20px;border-radius:10px;background:#E3E8EF;color:var(--mut);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.gu2{left:70px;top:8px;font-size:10px;color:#9CA3AF}
.dg2{left:70px;top:21px;font-size:12.5px;font-weight:700;color:var(--mut)}
.pv{right:14px;top:13px;font-size:15px;font-weight:700;color:var(--ltx)}
.bar{left:160px;right:80px;top:15px;height:11px;border-radius:5px;background:#E9EDF3}
.fill{height:100%;border-radius:inherit;background:var(--lt);transition:background .4s}
.avg{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.avg span{position:absolute;top:100%;left:50%;transform:translateX(-50%);padding-top:6px;font-size:10.5px;color:var(--mut);white-space:nowrap}
.fx{opacity:0;transform:translateY(5px);pointer-events:none;transition:opacity .2s,transform .25s}
.avg.fx{transform:none}
.gr{left:12px;top:52px;width:76px;height:26px;border-radius:13px;background:var(--gbg);color:var(--c);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.lab{right:14px;top:12px;font-size:11px;color:var(--mut)}
.df{right:14px;top:80px;font-size:11px;color:var(--mut)}.df b{color:var(--c)}
.sig{left:12px;right:12px;top:150px;display:flex;gap:12px;font-size:12px;color:var(--ink);line-height:18px!important}
.sl{font-weight:700;color:var(--mut)}
.sg{display:flex;align-items:center;gap:6px;line-height:18px}.sg i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.sig a{margin-left:auto;align-self:flex-end;color:#00A0E8;font-weight:700;cursor:pointer;pointer-events:auto}
.list:not(:hover) .r.first,.list .r:hover{height:196px}
.list:not(:hover) .r.first .c,.list .r:hover .c{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.list:not(:hover) .r.first .rk,.list .r:hover .rk{top:10px;width:76px;height:32px;border-radius:16px;background:var(--navy);color:#fff;font-size:13px}
.list:not(:hover) .r.first .gu2,.list .r:hover .gu2{left:104px;top:10px;font-size:15px;color:var(--mut)}
.list:not(:hover) .r.first .dg2,.list .r:hover .dg2{left:104px;top:32px;font-size:26px;color:var(--ink)}
.list:not(:hover) .r.first .pv,.list .r:hover .pv{right:14px;top:30px;font-size:50px;color:var(--c);letter-spacing:1px}
.list:not(:hover) .r.first .bar,.list .r:hover .bar{left:12px;right:12px;top:100px;height:28px;border-radius:8px;background:#EAEFF6}
.list:not(:hover) .r.first .fill,.list .r:hover .fill{background:var(--c)}
.list:not(:hover) .r.first .fx,.list .r:hover .fx{opacity:1;transform:none;transition:opacity .25s ease .15s,transform .3s ease .15s}
.toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:6px 12px;border-radius:6px;display:none}
</style></head>
<body><div id="root">
<svg id="map"><g id="g"></g></svg>
<div class="top">
  <div class="search"><input id="q" list="dl" placeholder="행정동·상권 검색 (예: 부전동)"><datalist id="dl"></datalist>
    <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5.5" fill="none" stroke="#6B7280" stroke-width="1.6"/><line x1="11" y1="11" x2="15" y2="15" stroke="#6B7280" stroke-width="1.6"/></svg></div>
  <div class="seg"><button class="on">행정동</button><button disabled title="상권 단위 집계 준비 중">상권</button></div>
  <button class="cmpbtn" id="cmpbtn">한 번에 비교하기</button>
</div>
<div class="ctl"><button id="zin" title="확대">+</button><button id="zout" title="축소">−</button><button id="zre" title="처음 위치">⟲</button><div class="gap"></div>
  <button id="fs" title="전체 화면">⛶</button><button id="ib" title="자료 안내">i</button></div>
<div class="legend" id="legend"></div>
<div class="src" id="src"></div>
<svg class="pin" id="pin" viewBox="0 0 22 22"><circle cx="11" cy="9" r="7" fill="#1A1D23"/><circle cx="11" cy="9" r="3" fill="#fff"/><path d="M6 13 L11 21 L16 13Z" fill="#1A1D23"/></svg>
<div class="info" id="info"></div>
<div class="cmp" id="cmp"><div class="x" id="cmpx">✕</div><select id="cmpsel"></select>
  <h3>한 번에 비교하기</h3><div class="sub">선택한 동을 같은 지표로 비교 (최대 4곳)</div>
  <div class="chips" id="chips"></div><div id="ctab"></div>
  <div class="foot">예측값은 모델 결과(<span id="ptag"></span>), 전년비는 부산시 카드·통신 실측 · 기준월 <span id="cm"></span></div></div>
<div class="dim" id="dim"></div>
<div class="pop" id="pop"><div class="x" id="x" title="닫기"></div>
  <h2>폐업예측 한 눈에 보기</h2><div class="sub" id="popsub"></div><div class="list" id="list"></div></div>
<div class="toast" id="toast"></div>
</div>
<script>
// ---- Streamlit 컴포넌트 통신 (빌드 도구 없이 postMessage) ----
function send(type,data){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},data),"*");}
function setValue(v){send("streamlit:setComponentValue",{value:v,dataType:"json"});}
window.addEventListener("message",function(e){if(e.data&&e.data.type==="streamlit:render")render(e.data.args);});
send("streamlit:componentReady",{apiVersion:1});

var D=null,popupOpen=null,cmpList=null,VB=null,VB0=null,proj=null,cent={};
var CC=["#1C2E57","#256ef4","#7EA3E6","#9aa3ad"];
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function f1(v,plus,unit){if(v==null||isNaN(v))return"-";return (plus&&v>0?"+":"")+Number(v).toFixed(1)+(unit||"");}
function go(code){setValue({action:"detail",dong:code,t:Date.now()});}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(function(){t.style.display="none";},1800);}

function render(a){
  D=a; var H=a.height||720; $("root").style.height=H+"px"; send("streamlit:setFrameHeight",{height:H});
  if(popupOpen===null)popupOpen=a.popup!==false;
  if(a.popup_nonce!==undefined&&a.popup_nonce!==window._pn){if(window._pn!==undefined)popupOpen=true;window._pn=a.popup_nonce;}
  if(cmpList===null)cmpList=a.compare_default||a.top.slice(0,2);
  drawMap(H); drawLegend(); drawPopup(); fillSearch(); drawCompare(); showPopup(popupOpen);
  $("src").textContent="실제로 폐업한 곳이 아니라 예측된 ‘폐업위험 신호’입니다. 보증 승인·제한 판단에 쓰지 않습니다.";
  $("ptag").textContent=a.pred_tag; $("cm").textContent=a.month_label;
}
// ---------- 지도 ----------
function drawMap(H){
  var svg=$("map"),W=svg.parentNode.clientWidth||1100;
  svg.setAttribute("width",W);svg.setAttribute("height",H);
  var fs=D.geo.features,x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  fs.forEach(function(f){f.geometry.coordinates.forEach(function(p){p.forEach(function(r){r.forEach(function(q){x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);});});});});
  var k=Math.cos(35.15*Math.PI/180),s=Math.min((W-40)/((x1-x0)*k),(H-40)/(y1-y0));
  var ox=(W-(x1-x0)*k*s)/2,oy=(H-(y1-y0)*s)/2;
  proj=function(q){return[(q[0]-x0)*k*s+ox,(y1-q[1])*s+oy];};
  var h="";
  fs.forEach(function(f){
    var c=f.properties["행정동코드"],d="",sx=0,sy=0,n=0;
    f.geometry.coordinates.forEach(function(p){p.forEach(function(r){d+="M"+r.map(function(q){var P=proj(q);sx+=P[0];sy+=P[1];n++;return P[0].toFixed(1)+" "+P[1].toFixed(1);}).join("L")+"Z";});});
    cent[c]=[sx/n,sy/n];
    var row=D.rows[c]||{},col=D.colors[row.stage]||"#f4f5f6";
    var dim=(D.gu&&D.gu!=="부산 전체"&&row.gu!==D.gu)||(row.stage==="판단 보류"&&!D.show_hold);
    h+='<path data-c="'+c+'" d="'+d+'" fill="'+(row.stage==="판단 보류"&&!D.show_hold?"#f4f5f6":col)+'" fill-opacity="'+(dim?0.35:1)+'"/>';
  });
  $("g").innerHTML=h;
  if(!VB0){VB0=[0,0,W,H];VB=VB0.slice();} setVB();
  svg.querySelectorAll("path").forEach(function(p){
    p.addEventListener("mouseenter",function(){if(dragMoved)return;hover(p.getAttribute("data-c"),p);});
    p.addEventListener("click",function(){if(!dragMoved)go(p.getAttribute("data-c"));});
  });
}
function setVB(){$("map").setAttribute("viewBox",VB.join(" "));if(lastHover)placePin(lastHover);}
function zoom(f,cx,cy){var w=VB[2]*f,h=VB[3]*f;if(w>VB0[2]*1.2||w<VB0[2]/12)return;cx=cx==null?VB[0]+VB[2]/2:cx;cy=cy==null?VB[1]+VB[3]/2:cy;VB=[cx-(cx-VB[0])*f,cy-(cy-VB[1])*f,w,h];setVB();}
$("zin").onclick=function(){zoom(0.7);}; $("zout").onclick=function(){zoom(1/0.7);}; $("zre").onclick=function(){VB=VB0.slice();setVB();};
$("map").addEventListener("wheel",function(e){e.preventDefault();var r=$("map").getBoundingClientRect();var cx=VB[0]+(e.clientX-r.left)/r.width*VB[2],cy=VB[1]+(e.clientY-r.top)/r.height*VB[3];zoom(e.deltaY<0?0.85:1/0.85,cx,cy);},{passive:false});
var drag=null,dragMoved=false;
$("map").addEventListener("mousedown",function(e){drag=[e.clientX,e.clientY,VB[0],VB[1]];dragMoved=false;});
window.addEventListener("mousemove",function(e){if(!drag)return;var r=$("map").getBoundingClientRect(),dx=(e.clientX-drag[0])/r.width*VB[2],dy=(e.clientY-drag[1])/r.height*VB[3];if(Math.abs(e.clientX-drag[0])+Math.abs(e.clientY-drag[1])>4){dragMoved=true;$("map").classList.add("drag");}VB[0]=drag[2]-dx;VB[1]=drag[3]-dy;setVB();});
window.addEventListener("mouseup",function(){drag=null;$("map").classList.remove("drag");setTimeout(function(){dragMoved=false;},0);});
$("fs").onclick=function(){var el=$("root");if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen();};
$("ib").onclick=function(){toast("폐업위험률: 모델 "+D.pred_tag+" · 카드·생활인구: 부산시 실측 · 기준월 "+D.month_label);};

var lastHover=null;
function placePin(c){var P=cent[c];if(!P)return;var r=$("map").getBoundingClientRect(),rr=$("root").getBoundingClientRect();
  var x=(P[0]-VB[0])/VB[2]*r.width+(r.left-rr.left),y=(P[1]-VB[1])/VB[3]*r.height+(r.top-rr.top);var pin=$("pin");pin.style.left=x+"px";pin.style.top=y+"px";pin.style.display="block";}
function hover(c,p){
  var g=$("g");g.querySelectorAll("path.on").forEach(function(o){o.classList.remove("on");});
  if(!p)p=g.querySelector('path[data-c="'+c+'"]'); if(p){p.classList.add("on");g.appendChild(p);}
  lastHover=c; placePin(c); showInfo(c);
}
function stageStyle(s){var c=D.colors[s]||"#eee";var dark=(s==="심각"||s==="경계");return'background:'+c+';color:'+(dark?"#fff":"#1A1D23");}
function showInfo(c){
  var r=D.rows[c],el=$("info");if(!r)return;el.style.display="block";
  var risk=r.risk==null?"판단 보류":f1(r.risk,false,"%")+' <span style="color:#6B7280">(부산 '+f1(D.avg,false,"%")+')</span>';
  var sig=r.signal?esc(r.signal.label)+" "+f1(r.signal.v,true,"%"):"-";
  el.innerHTML='<div class="h"><span class="dg">'+esc(r.dong)+'</span><span class="gu">'+esc(r.gu)+'</span><span class="st" style="'+stageStyle(r.stage)+'">'+esc(r.stage)+'</span></div>'+
   '<div class="rw"><span>예측 폐업확률 <span class="tag mock">'+esc(D.pred_tag)+'</span></span><b>'+risk+'</b></div>'+
   '<div class="rw"><span>주의 신호 <span class="tag real">실측</span></span><b style="color:#d6342c">'+sig+'</b></div>'+
   '<div class="rw"><span>신호 업종</span><b>'+(r.ind&&r.ind.length?esc(r.ind.join(" · ")):"-")+'</b></div>'+
   '<a class="go" onclick="go(\''+c+'\')">클릭하면 상세(②)로 이동 →</a>';
}
function drawLegend(){
  var h="<b>위험단계</b>";D.stages.forEach(function(s){h+='<div><i style="background:'+D.colors[s]+'"></i>'+esc(s)+'</div>';});$("legend").innerHTML=h;
}
// ---------- 검색 ----------
function fillSearch(){
  var o="";Object.keys(D.rows).forEach(function(c){var r=D.rows[c];o+='<option value="'+esc(r.gu+" "+r.dong)+'">';});$("dl").innerHTML=o;
}
$("q").addEventListener("change",function(){
  var v=this.value.trim();if(!v)return;
  var hit=Object.keys(D.rows).filter(function(c){var r=D.rows[c];return (r.gu+" "+r.dong)===v||r.dong===v||r.dong.indexOf(v)>=0;});
  if(!hit.length){toast("‘"+v+"’에 맞는 행정동이 없어요");return;}
  showPopup(false);var c=hit[0],P=cent[c];VB=[P[0]-VB0[2]*0.15,P[1]-VB0[3]*0.15,VB0[2]*0.3,VB0[3]*0.3];setVB();hover(c);
});
// ---------- 비교 패널 ----------
function drawCompare(){
  var sel='<option value="">행정동 선택</option>';
  Object.keys(D.rows).sort(function(a,b){var A=D.rows[a],B=D.rows[b];return (A.gu+A.dong).localeCompare(B.gu+B.dong);}).forEach(function(c){var r=D.rows[c];sel+='<option value="'+c+'">'+esc(r.gu+" "+r.dong)+'</option>';});
  $("cmpsel").innerHTML=sel;
  var ch="";cmpList.forEach(function(c,i){var r=D.rows[c];if(!r)return;ch+='<span class="chip" style="background:'+CC[i]+'">'+esc(r.gu+" "+r.dong)+' <b data-rm="'+c+'">✕</b></span>';});
  $("chips").innerHTML=ch;
  $("chips").querySelectorAll("[data-rm]").forEach(function(b){b.onclick=function(){cmpList=cmpList.filter(function(x){return x!==b.getAttribute("data-rm");});drawCompare();};});
  var M=[["예측 폐업확률","risk","%",true],["예상 폐업 점포","expect","곳",false],["카드 소비 전년비","card","%",false],["음식/주점 소비 전년비","food","%",false],["방문인구 전년비","visit","%",false],["직장인구 전년비","work","%",false],["영업 점포 수","shops","곳",false]];
  var t='<table><tr><th>지표</th>'+cmpList.map(function(c,i){return'<th style="color:'+CC[i]+';font-weight:700">'+esc(D.rows[c].dong)+'</th>';}).join("")+'<th>'+(cmpList.length===2?"차이":"최대−최소")+'</th></tr>';
  M.forEach(function(m){
    var vals=cmpList.map(function(c){return D.rows[c][m[1]];}),ok=vals.filter(function(v){return v!=null;});
    var diff=ok.length>=2?(cmpList.length===2?vals[0]-vals[1]:Math.max.apply(null,ok)-Math.min.apply(null,ok)):null;
    t+='<tr'+(m[3]?' class="hl"':'')+'><td>'+m[0]+(m[1]==="risk"||m[1]==="expect"||m[1]==="shops"?' <span class="tag mock">'+esc(D.pred_tag)+'</span>':' <span class="tag real">실측</span>')+'</td>'+
      vals.map(function(v,i){return'<td'+(i===0?' style="font-weight:700"':'')+'>'+(v==null?"-":(m[2]==="곳"?Math.round(v)+"곳":f1(v,m[1]!=="risk","%")))+'</td>';}).join("")+
      '<td class="d">'+(diff==null?"-":(m[2]==="곳"?(diff>0?"+":"")+Math.round(diff):f1(diff,true,m[1]==="risk"?"%p":"%p")))+'</td></tr>';
  });
  t+='</table>';$("ctab").innerHTML=cmpList.length?t:'<p style="color:#6B7280">오른쪽 위에서 행정동을 골라 주세요.</p>';
}
$("cmpsel").addEventListener("change",function(){var c=this.value;if(!c)return;if(cmpList.indexOf(c)<0){if(cmpList.length>=4){toast("최대 4곳까지 비교해요");}else cmpList.push(c);}this.value="";drawCompare();});
$("cmpbtn").onclick=function(){var on=$("cmp").style.display!=="block";showPopup(false);$("cmp").style.display=on?"block":"none";};
$("cmpx").onclick=function(){$("cmp").style.display="none";};
// ---------- TOP 팝업 ----------
function drawPopup(){
  $("popsub").textContent=D.month_label+" 기준 · 향후 6개월 폐업확률이 높은 순 · 다른 동에 마우스를 올리면 자세히 보입니다";
  var mx=Math.max.apply(null,D.top.map(function(c){return D.rows[c].risk||0;}))*1.25,avg=D.avg,h="";
  D.top.forEach(function(c,i){
    var r=D.rows[c],hi=(r.stage==="심각"||r.stage==="경계");
    var st=hi?"--c:#1450D2;--lt:#A9C4F2;--ltx:#7EA3E6;--gbg:#E3ECFB":"--c:#4C8FEA;--lt:#C6DBF8;--ltx:#94B9EF;--gbg:#EDF4FD";
    var sig=(r.factors||[]).slice(0,2).map(function(f){return'<div class="sg"><i></i>'+esc(f)+'</div>';}).join("");
    h+='<div class="r'+(i===0?" first":"")+'" style="'+st+'" data-c="'+c+'"><div class="c"><div class="rk">'+(i+1)+'순위</div><div class="gr fx">'+esc(r.stage)+'</div>'+
      '<div class="gu2">'+esc(r.gu)+'</div><div class="dg2">'+esc(r.dong)+'</div><div class="lab fx">향후 6개월 폐업확률</div><div class="pv">'+f1(r.risk,false,"%")+'</div>'+
      '<div class="df fx">부산 평균보다 <b>'+f1(r.diff,true,"%p")+'</b></div>'+
      '<div class="bar"><div class="fill" style="width:'+(r.risk/mx*100).toFixed(1)+'%"></div><div class="avg fx" style="left:'+(avg/mx*100).toFixed(1)+'%"><span>부산 평균 '+f1(avg,false,"%")+'</span></div></div>'+
      '<div class="sig fx"><div class="sl">위험<br>신호</div><div>'+sig+'</div><a data-go="'+c+'">상세 분석 →</a></div></div></div>';
  });
  var L=$("list");L.innerHTML=h;
  L.querySelectorAll("[data-go]").forEach(function(a){a.addEventListener("click",function(e){e.stopPropagation();go(a.getAttribute("data-go"));});});
}
function showPopup(on){popupOpen=on;$("pop").style.display=on?"block":"none";$("dim").style.display=on?"block":"none";if(on)$("cmp").style.display="none";}
$("x").onclick=function(){showPopup(false);}; $("dim").onclick=function(){showPopup(false);};
window.addEventListener("resize",function(){if(D){VB0=null;drawMap(D.height||720);}});
</script></body></html>
